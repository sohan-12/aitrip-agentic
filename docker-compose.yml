services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aitrip
      POSTGRES_USER: aitrip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aitrip-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitrip -d aitrip"]
      interval: 3s
      timeout: 5s
      retries: 20
volumes:
  aitrip-data:
